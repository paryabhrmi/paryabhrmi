name: Contribution grid

# Redraws assets/contributions-*.svg from the real calendar once a day.
# The SVGs are committed, so the README serves them from this repository
# rather than calling a third-party service on every page view.

# The daily schedule is off while the README does not show the grid, so the
# repository does not collect a bot commit every morning for an unused asset.
# Uncomment the two schedule lines to resume it.
on:
  # schedule:
  #   - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: contribution-grid
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Render the grid
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/contribution_grid.py --login "${{ github.repository_owner }}"

      - name: Commit if it changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          if git diff --staged --quiet; then
            echo "No change."
          else
            git commit -m "Refresh contribution grid"
            git push
          fi
